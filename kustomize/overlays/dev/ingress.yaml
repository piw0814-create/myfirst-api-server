apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  #  annotations:
  #    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: sk117-myfirst-ingress
  namespace: class-4
  labels:
    app: sk117-myfirst-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: sk117-myfirst-ingress.class-4.skala-us.com
      http:
        paths:
          - backend:
              service:
                name: sk117-myfirst-api-server
                port:
                  number: 8080
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - "sk117-ingress.class-4.skala-us.com"
      secretName: wildcard-class-4-skala-us-com-tls
